defaults:
  - _self_

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

model_name_or_path: "alexliap/typakos-140m-it"
tokenizer_path: null

ref_model_name_or_path: null

# typakos_140m_it's tokenizer already carries chat_template.jinja from the
# SFT stage, so no override needed.
chat_template_path: null

attn_implementation: "kernels-community/flash-attn2"
run_name: "typakos_140m_dpo_v1"

# Full-parameter DPO: matches the SFT stage's reasoning that 140M is small
# enough not to need LoRA. Add a `lora:` block back if that changes.
lora: null

dataset:
  dataset_id: "data/typakos_dpo_dataset"   # written by prepare_dpo_data.py
  dataset_split: "train"
  eval_split: "validation"
  dataset_format: "conversational"      # rows of {"prompt", "chosen", "rejected"} as message lists
  shuffle: true
  shuffle_seed: 0

dpo:
  output_dir: "checkpoints/typakos_140m_dpo"
  num_train_epochs: 1.0
  max_steps: -1                 # set > 0 for quick smoke tests
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2e-7
  lr_scheduler_type: "constant"
  warmup_ratio: null             # keep null: transformers 5.x lets warmup_steps win when set
  warmup_steps: 0.1             # fraction of total steps (see ../../../src/pretrain/dpo/config.py)
  max_grad_norm: 1.0
  weight_decay: 0.01
  # Betas/eps match the typakos_140m pretraining/SFT runs' optimizer settings.
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-10
  beta: 0.1
  loss_type: "sigmoid"
  label_smoothing: 0.0
  max_length: 2048
  truncation_mode: "keep_start"
  disable_dropout: true
  precompute_ref_log_probs: false
  dataset_num_proc: 16
  bf16: true
  gradient_checkpointing: false
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  eval_strategy: "steps"
  eval_steps: 500

logging:
  project_name: "typakos_140m_dpo"
  auto_log_gpu: true
