[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pretrain"]

[project.scripts]
pretrain-data = "pretrain.cli:main"

[project]
name = "pretrain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.4.2",
    "huggingface-hub>=0.36.0",
    "hydra-core>=1.3.0",
    "kernels==0.15.2",
    "omegaconf>=2.3.0",
    "peft>=0.17",
    "polars>=1.37.1",
    "python-dotenv>=1.0.0",
    "tokenizers>=0.20.0",
    "torch==2.11.0",
    "trackio[gpu]>=0.15.0",
    "transformers>5.0.0",
    "trl>=1.7.1",
]

[dependency-groups]
dev = ["pytest>=8"]

# torch has to be pinned to a CUDA build, not just a version. Resolved from PyPI
# it comes as a CUDA 13 wheel, and CUDA 13 needs a r580+ driver; this host runs
# 570.x (CUDA 12.8), so that build fails at `torch.cuda.is_available()` with
# "driver is too old" and every GPU is invisible. cu128 matches the driver
# exactly -- no reliance on CUDA minor-version compatibility -- and 2.11.0 is the
# newest torch with a cu128 build for this interpreter (cp314). Nothing in the
# dependency tree needs a newer torch.
#
# The pin belongs here rather than in an ad-hoc `uv pip install` because
# train.sh runs `uv run`, which re-syncs the environment from this file and would
# otherwise reinstate the CUDA 13 wheel.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
