defaults:
  - model: llama_80m
  - _self_

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

# Run-level (top-level) settings
# From scratch: no base checkpoint, and no LoRA (a `lora:` block here would train
# an adapter over a base this run does not have). The stopping criterion is
# total_tokens, which takes precedence over total_steps and num_epochs.
saved_checkpoint_path: null
compile: "torch"
num_epochs: 1
attn_implementation: "flash_attention_2"
total_steps: null
total_tokens: 10_000_000

# Data
data:
  tokenizer_path: "./models/bilingual_el_en_50k/"
  max_seq_length: 2048
  use_packed_data: true
  num_workers: 16
  train_batch_size: 16
  val_batch_size: 16

# Optimizer
optimizer:
  learning_rate: 5e-4
  eps: 1e-10
  betas:
    - 0.9
    - 0.95
  weight_decay: 0.01
  max_grad_norm: 1.0

# Scheduler
scheduler:
  warmup_steps: 2000

# Accelerate
accelerate:
  gradient_accumulation_steps: 1
  mixed_precision: "bf16"

# Validation
validation:
  val_check_interval: 1000
  val_size: null

# Logging
logging:
  project_name: "llama_80m_pretraining"
  auto_log_gpu: true
  log_every_n: 10

# Checkpoint saving
checkpoint:
  save_dir: "checkpoints"
  # Subdir name under save_dir. Falls back to model.name when null. Set this when
  # resuming from saved_checkpoint_path so the run dir isn't named after an unused
  # model config (e.g. qwen_small).
  experiment_name: "llama_80m_pretraining"
  run_name: "llama_80m_pretraining_v1"
  save_top_k: 3
  save_every_n_steps: 1000
  save_last: true
  max_shard_size: "5GB"

# Evaluation
evaluation:
  enabled: false
  humaneval:
    enabled: false
    num_samples: 50
    max_new_tokens: 512
    temperature: 0.0
  mmlu:
    enabled: false
    num_samples: 100
    temperature: 0.0
  ifeval:
    enabled: false
    num_samples: 50
    max_new_tokens: 512
    temperature: 0.0
  log_predictions: false
  save_results_dir: "eval_results"
