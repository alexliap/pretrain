defaults:
  - _self_

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

# Where DPO starts from: typically the finished SFT checkpoint.
# tokenizer_path defaults to model_name_or_path when null.
model_name_or_path: "<path-to-sft-checkpoint>"
tokenizer_path: null

# Explicit reference model; null lets DPOTrainer build one from
# model_name_or_path automatically (or use the PEFT disable-adapter trick
# instead of a second copy, when `lora` is set below).
ref_model_name_or_path: null

# Chat-template override with {% generation %} markers, matching whatever the
# SFT stage used. Set to null to keep the tokenizer's own template.
chat_template_path: null

attn_implementation: "kernels-community/flash-attn2"
run_name: null   # trackio run name; null -> timestamped "dpo-<date>"

# LoRA adapter (optional). Omit or set to null for full-parameter DPO.
lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]   # null lets peft auto-infer instead

# Dataset
dataset:
  dataset_id: "<dataset>"                # HF hub id, or a local save_to_disk directory
  dataset_split: "train"
  eval_split: "validation"
  # "conversational" = rows of {"prompt": [...], "chosen": [...], "rejected": [...]}
  dataset_format: "conversational"      # or "standard"
  shuffle: true                         # one-time shuffle of the train split at startup
  shuffle_seed: 0

# DPO / TrainingArguments knobs (forwarded to trl.DPOConfig)
dpo:
  output_dir: "checkpoints/dpo"
  num_train_epochs: 1.0
  max_steps: -1                 # set > 0 for quick smoke tests
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 5e-7
  lr_scheduler_type: "cosine"
  warmup_ratio: null
  warmup_steps: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-10
  beta: 0.1
  loss_type: "sigmoid"
  label_smoothing: 0.0
  max_length: 2048
  truncation_mode: "keep_start"
  disable_dropout: true
  precompute_ref_log_probs: false
  dataset_num_proc: 16
  bf16: true
  gradient_checkpointing: false
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  eval_strategy: "steps"           # "steps" when eval_split is set
  eval_steps: 500
  # trackio logging is wired automatically via a custom callback (see
  # pretrain.dpo.task.TrackioCallback); no report_to setting needed.

# Logging (trackio)
logging:
  project_name: "dpo"
  auto_log_gpu: true
  log_every_n: 10
